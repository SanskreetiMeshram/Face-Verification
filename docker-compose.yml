version: '3.8'

services:
  blockchain:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    ports:
      - "8545:8545"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REVERSE_SEARCH_PROVIDER=${REVERSE_SEARCH_PROVIDER:-serpapi}
      - REVERSE_SEARCH_API_KEY=${REVERSE_SEARCH_API_KEY:-}
      - BLOCKCHAIN_RPC_URL=${BLOCKCHAIN_RPC_URL:-http://blockchain:8545}
      - BLOCKCHAIN_PRIVATE_KEY=${BLOCKCHAIN_PRIVATE_KEY:-}
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS:-}
      - CHAIN_ID=${CHAIN_ID:-31337}
      - CHAIN_NAME=Local Hardhat Network
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,*
    volumes:
      - ./backend:/app
    depends_on:
      - blockchain
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
